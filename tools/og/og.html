<!doctype html>
<!-- The link preview (og-image.png, 1200 × 630), in the site's look: node tools/og/render.cjs -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist"; src: url(../../fonts/geist.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url(../../fonts/geist-mono.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #0A0A0B; color: #F2F2F3; font: 400 22px/1.4 "Geist", sans-serif; padding: 60px 72px 52px; }
  body::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 78% 45%, #000 20%, transparent 75%); }
  body::after { content: ""; position: absolute; width: 760px; height: 760px; right: -180px; top: -90px; background: radial-gradient(closest-side, rgba(61,220,255,.16), transparent); }
  .drone { position: absolute; right: -30px; top: 40px; width: 640px; height: 480px; background: url(../../images/hero/x15.webp) center / contain no-repeat; filter: drop-shadow(0 0 6px rgba(61,220,255,.45)); z-index: 1; }
  .copy { position: relative; z-index: 2; }
  .eyebrow { font: 500 17px/1 "Geist Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #3DDCFF; }
  h1 { margin-top: 22px; font: 650 112px/0.9 "Geist", sans-serif; letter-spacing: -0.055em; background: linear-gradient(180deg, #FFF 30%, #B9B9C4); -webkit-background-clip: text; color: transparent; }
  .role { margin-top: 22px; font: 500 30px/1.2 "Geist", sans-serif; letter-spacing: -0.02em; color: #C5C5CD; }
  .role span { color: #9C9CA6; }
  .chips { margin-top: 26px; display: flex; gap: 10px; }
  .chips span { padding: 8px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; font-size: 19px; color: #C5C5CD; }
  .chips span:first-child { border-color: rgba(61,220,255,.5); color: #F2F2F3; }
  .proof { position: absolute; z-index: 2; left: 72px; right: 72px; bottom: 48px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.12); }
  .proof small { display: block; font: 500 14px/1 "Geist Mono", monospace; letter-spacing: .06em; color: #9C9CA6; margin-bottom: 8px; }
  .proof b { font: 500 36px/1 "Geist Mono", monospace; letter-spacing: -0.03em; }
  .proof b sup { font-size: .5em; vertical-align: .8em; line-height: 0; }
  .proof div:first-child b { color: #3DDCFF; }
</style>
</head>
<body>
  <div class="drone"></div>
  <div class="copy">
    <p class="eyebrow">dom-t23.github.io/dominic-tataj</p>
    <h1>Dominic<br>Tataj</h1>
    <p class="role">Software, autonomy and systems <span>· MEng, UCL</span></p>
    <p class="chips"><span>Summer 2027 internship or 2027–28 placement</span><span>Full right to work in the UK</span></p>
  </div>
  <div class="proof">
    <div><small>E-04 · Drone racing</small><b>98.6%</b></div>
    <div><small>E-03 · Drone frame</small><b>246&nbsp;g</b></div>
    <div><small>E-02 · Pipe climber</small><b>Climbed</b></div>
    <div><small>E-01 · AI scaling</small><b>P∝N<sup>0.55</sup></b></div>
  </div>
</body>
</html>

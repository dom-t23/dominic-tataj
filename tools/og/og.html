<!doctype html>
<!-- The link preview (og-image.png, 1200 × 630), in the site's look: node tools/og/render.cjs -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Source Serif Display"; src: url(../../fonts/source-serif-display.woff2) format("woff2"); font-weight: 500 700; font-display: block; }
  @font-face { font-family: "IBM Plex Sans"; src: url(../../fonts/plex-sans.woff2) format("woff2"); font-weight: 100 700; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url(../../fonts/plex-mono-500.woff2) format("woff2"); font-weight: 500; font-display: block; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #141311; color: #EDE8E0; font: 400 22px/1.4 "IBM Plex Sans", sans-serif; padding: 64px 72px 52px; }
  .drone { position: absolute; right: 0; top: 30px; width: 620px; height: 465px; background: url(../../images/hero/x15.webp) center / contain no-repeat; }
  .copy { position: relative; z-index: 2; }
  h1 { font: 600 118px/0.92 "Source Serif Display", serif; letter-spacing: -0.025em; }
  .role { margin-top: 22px; font: 500 30px/1.2 "IBM Plex Sans", sans-serif; color: #C9C2B6; }
  .role span { color: #A39C90; }
  .facts { margin-top: 24px; font-size: 21px; color: #C9C2B6; }
  .facts b { color: #EDE8E0; font-weight: 500; }
  .proof { position: absolute; z-index: 2; left: 72px; right: 72px; bottom: 50px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
  .proof div { padding-top: 14px; border-top: 1px solid rgba(237,232,224,.32); }
  .proof small { display: block; font: 500 15px/1 "IBM Plex Mono", monospace; color: #A39C90; margin-bottom: 10px; }
  .proof b { font: 500 34px/1 "IBM Plex Mono", monospace; letter-spacing: -0.02em; }
  .proof b sup { font-size: .5em; vertical-align: .8em; line-height: 0; }
  .url { position: absolute; top: 64px; right: 72px; z-index: 2; font: 500 16px/1 "IBM Plex Mono", monospace; color: #FF7F47; }
</style>
</head>
<body>
  <div class="drone"></div>
  <p class="url">dom-t23.github.io/dominic-tataj</p>
  <div class="copy">
    <h1>Dominic<br>Tataj</h1>
    <p class="role">Software, autonomy and systems <span>· MEng, UCL</span></p>
    <p class="facts"><b>Summer 2027 internship or 2027–28 placement.</b> Full right to work in the UK.</p>
  </div>
  <div class="proof">
    <div><small>E-04 · Drone racing</small><b>98.6%</b></div>
    <div><small>E-03 · Drone frame</small><b>246&nbsp;g</b></div>
    <div><small>E-02 · Pipe climber</small><b>Climbed</b></div>
    <div><small>E-01 · AI scaling</small><b>P∝N<sup>0.55</sup></b></div>
  </div>
</body>
</html>
